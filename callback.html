<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>GradeScan sign-in</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f3ec;color:#2b2118;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:24px}
  main{max-width:420px;text-align:center}
  h1{font-size:22px;margin:0 0 12px}
  p{line-height:1.5;margin:8px 0}
  .btn{display:inline-block;background:#3d3128;color:#fff;padding:12px 22px;border-radius:8px;text-decoration:none;margin-top:12px}
  [hidden]{display:none}
</style>
</head>
<body>
<main>
  <h1 id="title">Returning to GradeScan…</h1>
  <p id="msg"></p>
  <p id="open" hidden><a class="btn" id="link" href="#">Open GradeScan</a></p>
</main>
<script>
/*
 * GradeScan sign-in relay (static page, hosted on GitHub Pages).
 *
 * Google sends the browser here after the consent screen, with ?code=…&state=… (or ?error=…).
 * This page contains NO secrets: it only forwards those values to the GradeScan app through an
 * app link, and the app completes the sign-in with its own server. The app link is read from
 * `state` (it was put there by the server) and is accepted ONLY when it is an app link
 * (Expo Go or the installed app), never a website.
 *
 * If you changed "scheme" in the app's app.json, add it here too (with a colon).
 */
(function () {
  var APP_SCHEMES = ['exp:', 'exps:', 'gradescan:'];

  var params = new URLSearchParams(location.search);
  var state = params.get('state') || '';
  var code = params.get('code') || '';
  var error = params.get('error') || '';

  function show(title, message) {
    document.getElementById('title').textContent = title;
    document.getElementById('msg').textContent = message || '';
  }

  // state = base64url(JSON {r: appLink, e: expiry, n: nonce}) + "." + signature
  function returnUrlFromState(s) {
    try {
      var b64 = s.split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var json = decodeURIComponent(escape(atob(b64)));
      var r = JSON.parse(json).r;
      if (typeof r !== 'string' || r.length === 0 || r.length > 600 || /[\s<>"'`]/.test(r)) return null;
      var scheme = new URL(r).protocol.toLowerCase();
      return APP_SCHEMES.indexOf(scheme) === -1 ? null : r;
    } catch (e) {
      return null;
    }
  }

  var back = returnUrlFromState(state);
  if (!back) {
    show('Cannot sign in from here', 'Open the sign-in from the GradeScan app (Settings → Continue with Google).');
    return;
  }

  var query;
  if (error) {
    query = 'error=' + encodeURIComponent(error === 'access_denied' ? 'cancelled' : error.slice(0, 80));
  } else if (code) {
    query = 'code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state);
  } else {
    query = 'error=' + encodeURIComponent('Google did not send a sign-in code');
  }
  var target = back + (back.indexOf('?') === -1 ? '?' : '&') + query;

  show(error ? 'Sign-in cancelled' : 'Almost done', 'Returning to GradeScan…');
  document.getElementById('link').href = target;
  document.getElementById('open').hidden = false;
  // Some browsers only open an app after a tap, hence the button as well as the automatic redirect.
  setTimeout(function () { window.location.href = target; }, 300);
})();
</script>
</body>
</html>
